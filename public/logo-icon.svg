<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    
    <!-- Emerald Brand Glow -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    
    <!-- Indigo Accent Gradient -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.6"/>
    </linearGradient>
    
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Badge Tile -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" filter="url(#shadow)"/>
  
  <!-- Subtle Inner Grid Gridline / Glass Line -->
  <rect x="40" y="40" width="432" height="432" rx="92" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

  <!-- Building / Growth Node Graphic -->
  <g filter="url(#glow)">
    <!-- Left Column (Building Bar 1) -->
    <rect x="128" y="240" width="60" height="150" rx="14" fill="url(#indigoGrad)" opacity="0.85"/>
    
    <!-- Middle Column (Building Bar 2 - Taller) -->
    <rect x="214" y="160" width="60" height="230" rx="14" fill="url(#indigoGrad)"/>
    
    <!-- Right Column (Growth Bar 3 - Peak) -->
    <rect x="300" y="110" width="60" height="280" rx="14" fill="url(#emeraldGrad)"/>
  </g>

  <!-- Glowing Checkmark Overlay -->
  <path d="M140 280 L230 370 L380 180" 
        fill="none" 
        stroke="url(#emeraldGrad)" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
        
  <!-- Inner White Accent Line for Checkmark -->
  <path d="M140 280 L230 370 L380 180" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.9"/>
</svg>
