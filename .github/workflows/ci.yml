name: CI

# Until this existed, a pull request's only check was Vercel's build — which
# compiles the app but never runs the test suite. That is how the register-page
# error display regressed: the build stayed green while a failing test and an
# ESLint warning both went unread.
on:
  # `types` stated explicitly rather than left to the default (#132). The
  # default is opened + synchronize + reopened, which does **not** include
  # `ready_for_review` — so a draft PR converted to ready fires no new run. If
  # its last run was cancelled or predates a base change, the PR then sits with
  # no current check and nothing says so, which is this issue's symptom exactly.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Manual escape hatch for #132: the pull_request event has now been observed
  # completely dead for a branch (three delivery attempts, zero runs), and
  # absence looks identical to passing. workflow_dispatch lets a session run
  # the same jobs against any ref and link the run on the PR.
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run redundant.
#
# Note for anyone diagnosing #132: this is a *second* way a run goes missing
# that is not a delivery failure. A superseded run is `cancelled`, and a
# cancelled run reads as "no green check" in the PR UI — indistinguishable at a
# glance from never having run. Check the conclusion, not just the presence of
# a tick. Keyed on `github.ref`, so it never cancels across branches.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 requires ^22.22.2 || ^24.15.0, and its undici 8 dependency
          # calls webidl.util.markAsUncloneable, which does not exist before
          # Node 22. On 20 the environment fails to construct and the whole
          # suite reports "no tests" rather than a single failure.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Kept as separate steps rather than `npm test` (which chains
      # lint && typecheck && vitest) so a failure names the stage that broke.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `--coverage` on purpose (#51). The thresholds in vitest.config.ts were
      # declared for months and executed by nothing, so they were free to be
      # wrong — and eight documents cited them as evidence the code was
      # covered. Running them here is what makes the number mean something; a
      # drop below the floor now fails the pull request instead of being
      # discovered by whoever next runs the script by hand.
      - name: Unit tests and coverage gate
        run: npx vitest run --coverage

      - name: Build
        run: npm run build
        env:
          # The build must not depend on real credentials. These are obvious
          # placeholders; isSupabaseConfigured() rejects them at runtime, so the
          # app builds in its demo posture rather than reaching a live project.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder-url.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  e2e:
    name: Playwright E2E (demo posture)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The suite sat un-run for its whole life, long enough to accumulate
    # assertions that contradicted the unit suite (#69/#91) — a check that
    # never runs is indistinguishable from one that passes (#35/#38/#46).
    # It runs against a build with no Supabase env at all, so
    # isClientDemoMode() is on and the scenarios assert the demo-deployment
    # contract: sandbox fixtures, demo public objects, honest 503 refusals on
    # every mutation. Scenario 10 (deployed health) self-skips here.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Without this every test fails in ~2ms with "Executable doesn't
      # exist" — a failure mode easy to misread as "the app is broken" (#91).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build (demo posture — deliberately no Supabase env)
        run: npm run build

      - name: Run E2E suite
        run: npm run test:e2e

  migration-verify:
    name: Migrations against real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Every migration promise — RLS posture, grants, CHECK constraints,
    # idempotency — is a property of the resulting database, not of the SQL
    # file (#35). This applies the full set twice to a throwaway Postgres 16
    # and asserts those properties; a migration that re-opens anon access to a
    # tenant table fails here instead of in production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Apply twice and assert
        run: scripts/ci-verify-migrations.sh
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres

  migration-guard:
    name: Migration ordering reminder
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Migrations are applied by hand and Vercel auto-deploys main, so nothing
      # otherwise connects the two. A PR carrying a migration needs it applied
      # before (or with) the merge; shipping the code first leaves the new
      # columns missing and any dropped policy still live.
      - name: Warn when a PR carries a schema migration
        run: |
          BASE="origin/${{ github.base_ref }}"
          # checkout used fetch-depth: 0, so the base ref is already local.
          git rev-parse --verify "$BASE" >/dev/null 2>&1 || \
            git fetch --no-tags origin "${{ github.base_ref }}:$BASE"

          CHANGED=$(git diff --name-only "$BASE"...HEAD -- supabase/migrations/ || true)

          if [ -n "$CHANGED" ]; then
            echo "::warning title=Schema migration in this PR::This PR changes supabase/migrations/. Apply the migration BEFORE or WITH the merge — Vercel auto-deploys main and migrations are manual. See docs/deployment.md."
            echo "### :warning: This PR contains a schema migration" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Migrations are **not** applied automatically. Vercel deploys \`main\` on merge, so merging alone ships code against the old schema." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Required order:" >> "$GITHUB_STEP_SUMMARY"
            echo "1. Set any new environment variables (inert until the code lands)." >> "$GITHUB_STEP_SUMMARY"
            echo "2. Run \`npm run db:migrate\` against production." >> "$GITHUB_STEP_SUMMARY"
            echo "3. Merge." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Files:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$CHANGED" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No migration files touched."
          fi

  migrations-applied:
    name: Migrations applied to production
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    # The reminder job above says a PR *carries* a migration. It cannot say
    # whether that migration is *applied*, because that is a fact about the
    # database rather than the diff — and twice in one week a migration merged,
    # Vercel deployed the code needing it, and the schema followed later
    # (#394 took owner confirmation down for a day; #382/#371 sent a client
    # paying a remainder to a 409). Both were caught by an audit that happened
    # to run. This job is what watches.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `secrets` cannot be used in a job-level `if`, so the branch is here.
      # Absence is reported loudly rather than passing quietly: a gate that
      # silently does nothing reads exactly like a gate that found nothing,
      # which is the failure mode this job exists to end.
      - name: Verify every repo migration has a ledger row in production
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::warning title=Migration gate INACTIVE::SUPABASE_DB_URL is not configured, so it was NOT verified that this PR's migrations are applied to production. Add the secret to activate this gate."
            {
              echo "### :warning: Migration gate is INACTIVE"
              echo ""
              echo "\`SUPABASE_DB_URL\` is not configured as a repository secret, so **nothing was checked**."
              echo ""
              echo "This job exists because two migrations reached production behind their code in one week."
              echo "Until the secret is set, that failure mode is still unguarded — add it to turn this into a real gate."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          npm run verify:migrations
